# .deb and .rpm packages (nfpm). Expects VERSION (without "v") and ARCH
# (amd64 or arm64) in the environment and the binary at build/linux/digwire.
name: digwire
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: net
priority: optional
maintainer: Joop Kiefte <ikojba@gmail.com>
description: |
  Modern hybrid BitTorrent swarm and multi-source web download manager,
  with a web interface opened in its own window.
homepage: https://github.com/LaPingvino/digwire
license: see /usr/share/doc/digwire
contents:
  - src: build/linux/digwire
    dst: /usr/bin/digwire
    file_info: { mode: 0755 }
  - src: assets/digwire.desktop
    dst: /usr/share/applications/digwire.desktop
  - src: assets/digwire.png
    dst: /usr/share/icons/hicolor/512x512/apps/digwire.png
  - src: README.md
    dst: /usr/share/doc/digwire/README.md
